<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Атлас анатомии — учить анатомию наглядно</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
:root{--bg:#f7f0e7;--card:#fffaf3;--ink:#2b211b;--mute:#7a6a5d;--line:#e3d5c4;--acc:#a8493f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1613;--card:#261f1b;--ink:#f1e7dc;--mute:#a89685;--line:#3a2f28;--acc:#e0806f}}
:root[data-theme="dark"]{--bg:#1c1613;--card:#261f1b;--ink:#f1e7dc;--mute:#a89685;--line:#3a2f28;--acc:#e0806f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.55}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
header{display:flex;align-items:baseline;gap:14px;padding:22px clamp(18px,4vw,56px);border-bottom:1px solid var(--line)}
header b{font-size:26px;font-weight:600}header span{color:var(--mute);font-style:italic;font-size:18px}
main{max-width:1240px;margin:0 auto;padding:28px clamp(18px,4vw,56px) 56px}
h2.lib{font-size:15px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 14px}
.grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;transition:.2s}
.chip i{width:10px;height:10px;border-radius:50%}
.chip:hover{border-color:var(--acc)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:stretch}
.view{position:relative;min-height:520px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(circle at 50% 42%,var(--card),var(--bg) 80%);overflow:hidden}
#v{position:absolute;inset:0;touch-action:none;cursor:grab}#v:active{cursor:grabbing}
#v canvas{display:block;width:100%;height:100%}
.tools{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;z-index:2}
.tools button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.tools button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute);font-size:14px;z-index:1;pointer-events:none}
.hint{position:absolute;right:16px;bottom:20px;color:var(--mute);font-size:12px;z-index:2;text-align:right}
.info{padding:6px 4px}
.lat{color:var(--acc);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.info h1{font-size:clamp(40px,5vw,60px);line-height:1.05;margin:4px 0 2px;font-weight:600}
.sub{font-style:italic;color:var(--mute);font-size:22px;margin:0 0 16px}
.info p{margin:0 0 18px}
dl{margin:0 0 20px;border-top:1px solid var(--line)}
dl div{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
dt{width:118px;flex:none;color:var(--mute)}dd{margin:0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.fact b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:4px;font-weight:500}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 20px 30px}
@media(max-width:860px){.stage{grid-template-columns:1fr}.view{min-height:420px}#ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute);font-size:14px;z-index:1;pointer-events:none}
.hint{display:none}}
</style>
</head>
<body>
<header><b class="serif">Атлас анатомии ✦</b><span class="serif">Учить анатомию наглядно</span></header>
<main>
<h2 class="lib">Библиотека органов</h2>
<div class="grid" id="lib"></div>
<section class="stage">
<div class="view"><div id="v"></div><div id="ld"></div>
<div class="tools"><button id="auto" class="on">Вращать</button><button id="reset">Сброс</button></div>
<div class="hint">Тяните — вращать · Прокрутка — масштаб</div></div>
<div class="info" id="info"></div>
</section>
</main>
<footer>Учебные 3D-модели, не медицинский справочник.</footer>
<script>
const D=[
{n:'Сердце',l:'Cor',s:'Неутомимый насос',c:'#b8433f',sys:'Сердечно-сосудистая система',t:'Мышечный орган, который перекачивает кровь по всему телу, доставляя кислород и питательные вещества каждой клетке.',f:[['Размер','Примерно с кулак'],['Масса','250–350 г'],['Расположение','За грудиной, чуть левее'],['Функция','Кровообращение']],a:'',k:'Сердце совершает около 100 000 сокращений в сутки и начинает биться ещё до рождения.'},
{n:'Кожа',l:'Cutis',s:'Живой барьер',c:'#e29c8c',sys:'Покровная система',t:'Крупнейший орган тела. Состоит из эпидермиса, дермы и гиподермы, защищает от внешней среды и помогает регулировать температуру.',f:[['Площадь','1,5–2 м²'],['Масса','3–4 кг у взрослого'],['Слои','Эпидермис, дерма, гиподерма'],['Функция','Защита, терморегуляция, осязание']],a:'',k:'Верхний слой кожи полностью обновляется примерно за месяц.'},
{n:'Глаз',l:'Oculus',s:'Окно в мир',c:'#5b86a8',sys:'Сенсорная система',t:'Орган зрения. Роговица и хрусталик фокусируют свет на сетчатке, а зрительный нерв передаёт сигнал в мозг.',f:[['Диаметр','Около 24 мм'],['Масса','Около 7,5 г'],['Расположение','Глазница черепа'],['Функция','Зрение']],a:'',k:'В сетчатке около 120 млн палочек и 6 млн колбочек.'},
{n:'Печень',l:'Hepar',s:'Химическая лаборатория',c:'#8a3a2a',sys:'Пищеварительная система',t:'Крупнейшая железа тела: перерабатывает питательные вещества, обезвреживает токсины, вырабатывает желчь.',f:[['Масса','1,2–1,5 кг'],['Расположение','Правое подреберье'],['Функции','Метаболизм, детоксикация, желчь'],['Особенность','Способна восстанавливаться']],a:'',k:'Печень выполняет сотни функций и может восстановиться после потери части ткани.'},
{n:'Лёгкие',l:'Pulmones',s:'Дыхание жизни',c:'#e39a9a',sys:'Дыхательная система',t:'Парный орган газообмена: в альвеолах кислород переходит в кровь, а углекислый газ выводится наружу.',f:[['Масса','1,0–1,3 кг (оба)'],['Расположение','Грудная клетка'],['Строение','Правое — 3 доли, левое — 2'],['Функция','Газообмен']],a:'',k:'В лёгких около 300–500 млн альвеол — площадь газообмена сопоставима с теннисным кортом.'},
{n:'Головной мозг',l:'Encephalon',s:'Центр управления',c:'#dba8a3',sys:'Нервная система',t:'Управляет мыслями, движениями, чувствами и внутренними процессами. Состоит из больших полушарий, мозжечка и ствола.',f:[['Масса','1,3–1,4 кг'],['Расположение','Полость черепа'],['Клетки','Около 86 млрд нейронов'],['Функция','Управление организмом']],a:'',k:'Мозг — около 2% массы тела, но потребляет примерно 20% энергии.'},
{n:'Почки',l:'Renes',s:'Фильтры организма',c:'#8f3d3f',sys:'Мочевыделительная система',t:'Парные органы, которые фильтруют кровь, выводят лишнее и поддерживают водно-солевой баланс.',f:[['Размер','10–12 см каждая'],['Масса','120–170 г каждая'],['Расположение','Забрюшинно, по бокам от позвоночника'],['Функция','Фильтрация, образование мочи']],a:'',k:'Почки фильтруют около 180 литров жидкости в сутки, образуя лишь 1–2 литра мочи.'},
{n:'Кишечник',l:'Intestinum',s:'Путь питательных веществ',c:'#e0a08a',sys:'Пищеварительная система',t:'Тонкая кишка завершает переваривание и всасывает питательные вещества, толстая — всасывает воду и формирует каловые массы.',f:[['Тонкая кишка','6–7 м'],['Толстая кишка','Около 1,5 м'],['Расположение','Брюшная полость'],['Функция','Всасывание, пищеварение']],a:'',k:'Складки и ворсинки многократно увеличивают всасывающую поверхность кишечника.'},
{n:'Поджелудочная железа',l:'Pancreas',s:'Ферменты и гормоны',c:'#e3b36b',sys:'Эндокринная система',t:'Вырабатывает пищеварительные ферменты и гормоны — инсулин и глюкагон, регулирующие уровень сахара в крови.',f:[['Длина','12–15 см'],['Масса','70–100 г'],['Расположение','Забрюшинно, позади желудка'],['Функция','Ферменты и гормоны']],a:'',k:'Инсулин вырабатывают клетки островков Лангерганса — они составляют лишь 1–2% железы.'}
];
const N=['heart','skin','eye','liver','lungs','brain','kidneys','intestine','pancreas'];
const box=document.getElementById('v'),ld=document.getElementById('ld');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.25;box.appendChild(R.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,200);cam.position.z=9;
sc.add(new THREE.AmbientLight(0xffffff,.55),new THREE.HemisphereLight(0xffffff,0xb89a80,.8));
const d1=new THREE.DirectionalLight(0xffffff,1.1);d1.position.set(3,4,5);sc.add(d1);
const d2=new THREE.DirectionalLight(0xffd9b8,.5);d2.position.set(-4,-2,-3);sc.add(d2);
const pivot=new THREE.Group();sc.add(pivot);
let auto=true,drag=false,px=0,py=0,cur=-1;const cache={},loader=new THREE.GLTFLoader();
function fit(){const w=box.clientWidth,h=box.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(fit).observe(box);
function place(g){while(pivot.children.length)pivot.remove(pivot.children[0]);pivot.add(g);pivot.rotation.set(.15,-.5,0);cam.position.z=9}
function load(i){cur=i;ld.textContent='';
document.querySelectorAll('.chip').forEach((b,k)=>b.classList.toggle('on',k===i));
const o=D[i];document.getElementById('info').innerHTML=`<div class="lat serif">${o.l} · ${o.sys}</div><h1 class="serif">${o.n}</h1><p class="sub serif">${o.s}</p><p>${o.t}</p><dl>${o.f.map(x=>`<div><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join('')}</dl><div class="fact"><b>А вы знали</b>${o.k}</div>${o.a?`<p style="font-size:12px;color:var(--mute);margin-top:14px">3D-модель: ${o.a}</p>`:''}`;
if(cache[i]){place(cache[i]);return}
pivot.children.length&&place(new THREE.Group());ld.textContent='Загрузка модели…';
loader.load('models/'+N[i]+'.glb',gl=>{
const g=gl.scene;g.traverse(m=>{if(m.isMesh&&m.material){(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>x.side=THREE.DoubleSide)}});
const bb=new THREE.Box3().setFromObject(g),c=bb.getCenter(new THREE.Vector3()),s=bb.getSize(new THREE.Vector3());
g.position.sub(c);const w=new THREE.Group();w.add(g);w.scale.setScalar(4.4/Math.max(s.x,s.y,s.z));cache[i]=w;
if(cur===i){ld.textContent='';place(w)}},
e=>{if(cur===i&&e.total)ld.textContent='Загрузка модели… '+Math.round(e.loaded/e.total*100)+'%'},
()=>{if(cur===i)ld.textContent='Не удалось загрузить модель. Откройте сайт через веб-сервер или хостинг, а не двойным щелчком по файлу.'})}
const lib=document.getElementById('lib');
D.forEach((o,i)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=`<i style="background:${o.c}"></i>${o.n}`;b.onclick=()=>load(i);lib.appendChild(b)});
const el=R.domElement;
el.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!drag)return;pivot.rotation.y+=(e.clientX-px)*.01;pivot.rotation.x=Math.max(-1.5,Math.min(1.5,pivot.rotation.x+(e.clientY-py)*.01));px=e.clientX;py=e.clientY});
['pointerup','pointercancel'].forEach(t=>el.addEventListener(t,()=>drag=false));
el.addEventListener('wheel',e=>{e.preventDefault();cam.position.z=Math.max(3,Math.min(18,cam.position.z+e.deltaY*.01))},{passive:false});
const ab=document.getElementById('auto');ab.onclick=()=>{auto=!auto;ab.classList.toggle('on',auto)};
document.getElementById('reset').onclick=()=>{pivot.rotation.set(.15,-.5,0);cam.position.z=9};
(function loop(){requestAnimationFrame(loop);if(auto&&!drag)pivot.rotation.y+=.006;R.render(sc,cam)})();
fit();load(0);
</script>
</body>
</html>
